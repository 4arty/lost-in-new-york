          { type: "p", value: "Anya had been dreaming about New York for as long as she could remember. At 22, she had finally saved enough money to fly from Moscow to the city that never sleeps. As the plane touched down at JFK, her heart was racing with a mixture of excitement and sheer terror." },

        text: [
          { type: "p", value: "Anya barely slept. All night, the little black flash drive sat on the nightstand, and all night she kept glancing at it, as if it might suddenly explain itself. By morning, curiosity had won." },
          { type: "img", value: "ch4_b2_1.jpg" },

        title: "Following the Clues",
        text: [
          { type: "p", value: "Jake glanced toward the window. The man in the dark coat was still there, motionless, like he had all the time in the world. \"We need to leave,\" Jake said, his voice low. \"Right now.\"" },
          { type: "img", value: "ch5_b2_1.jpg" },

          { type: "img", value: "ch5_b2_2.jpg" },
          { type: "p", value: "\"I know someone who might help,\" Jake said as they descended the stairs. \"An old friend of my father's. His name is Sam. He used to be an investigative journalist — before he retired.\"" },
          { type: "p", value: "\"Can we trust him?\" Anya asked." },
          { type: "p", value: "\"I trust him with my life,\" Jake said." },
          { type: "p", value: "Sam lived in Queens, in a small apartment that smelled of dust and paper. Books lined every wall, stacked in towers on the floor. He was a quiet, careful man with grey eyes that missed nothing." },

          { type: "p", value: "\"This is more serious than you think,\" he said. \"This flash drive belongs to a man named Viktor Melnik. He's not just a criminal — he's the kind of criminal who has friends in very high places. Do you know him?\"" },

          { type: "p", value: "Sam made one phone call. He spoke quietly, in short sentences, and hung up without saying goodbye. Then he turned to them." },

          { type: "p", value: "\"So we give it to her and we're done?\" Anya asked." },

const TOTAL_CHAPTERS = 7;

// ============ СОСТОЯНИЕ ============
let state = {
  level: null,
  screen: "start",
  chapterIndex: 0,
  answers: {},
  currentExercise: 0
};

let progress = JSON.parse(localStorage.getItem("liny_progress") || "{}");

function saveProgress() {
  localStorage.setItem("liny_progress", JSON.stringify(progress));
}

function getLevelProgress() {
  if (!state.level) return {};
  if (!progress[state.level]) progress[state.level] = {};
  return progress[state.level];
}

const app = document.getElementById("app");

// ============ РЕНДЕР ============
function render() {
  if (state.screen === "start") renderStart();
  else if (state.screen === "map") renderMap();
  else if (state.screen === "chapter") renderChapter();
  else if (state.screen === "exercises") renderExercises();
  else if (state.screen === "result") renderResult();
}

function renderStart() {
  let greeting = "";
  if (telegramUser && telegramUser.first_name) {
    greeting = `<p class="user-greeting">Привет, ${telegramUser.first_name}! 👋</p>`;
  }
  app.innerHTML = `
    ${greeting}
    <h1>Lost in New York</h1>
    <p class="subtitle">Интерактивная история для изучения английского</p>
    <p>Выбери уровень:</p>
    <button onclick="chooseLevel('a2')">A2 — Elementary</button>
    <button class="secondary" onclick="chooseLevel('b2')">B2 — Upper-Intermediate</button>
  `;
}

function chooseLevel(level) {
  state.level = level;
  state.screen = "map";
  render();
}

function renderMap() {
  const chapters = content[state.level].chapters;
  const lp = getLevelProgress();

  let html = `
    <div class="topnav">
      <span class="level-tag">Уровень ${state.level.toUpperCase()}</span>
      <button class="secondary" onclick="backToStart()">Сменить уровень</button>
    </div>
    <h1>Lost in New York</h1>
    <p class="subtitle">Выбери главу</p>
    <div class="chapter-map">
  `;

  for (let i = 1; i <= TOTAL_CHAPTERS; i++) {
    const chapter = chapters[i - 1];
    const isDone = lp[i] && lp[i].done;
    const isAvailable = i === 1 || (lp[i - 1] && lp[i - 1].done);
    const isLocked = !isAvailable;

    let cls = "chapter-btn";
    if (isDone) cls += " done";
    if (isLocked) cls += " locked";

    let status = "🔒";
    if (isDone) status = "✅";
    else if (isAvailable) status = "▶️";

    const title = chapter ? chapter.title : "Скоро...";

    html += `
      <button class="${cls}" 
              ${isLocked || !chapter ? "disabled" : ""} 
              onclick="openChapter(${i - 1})">
        <div class="chapter-num">${i}</div>
        <div class="chapter-title">${title}</div>
        <div class="chapter-status">${status}</div>
      </button>
    `;
  }

  html += `</div>`;
  app.innerHTML = html;
}

function backToStart() {
  state.level = null;
  state.screen = "start";
  render();
}

function openChapter(index) {
  state.chapterIndex = index;
  state.screen = "chapter";
  render();
}

function backToMap() {
  state.screen = "map";
  render();
}

function renderChapter() {
  const c = content[state.level].chapters[state.chapterIndex];
  let html = `
    <div class="topnav">
      <button class="secondary" onclick="backToMap()">← Главы</button>
      <span class="level-tag">${state.level.toUpperCase()}</span>
    </div>
    <h1>Chapter ${c.id}: ${c.title}</h1>
  `;
  c.text.forEach(block => {
    if (block.type === "p") {
      html += `<p>${block.value}</p>`;
    } else if (block.type === "img") {
      html += renderImage(block.value);
    }
  });
  html += `<button onclick="startExercises()">К заданиям →</button>`;
  app.innerHTML = html;
}

function renderImage(filename) {
  return `
    <div class="img-placeholder" id="img-${filename}">
      🖼 ${filename}
    </div>
    <img src="images/${filename}" class="chapter-img hidden" 
         onload="document.getElementById('img-${filename}').classList.add('hidden'); this.classList.remove('hidden');"
         onerror="this.remove();">
  `;
}

function startExercises() {
  state.screen = "exercises";
  state.currentExercise = 0;
  state.answers = {};
  render();
}

function renderExercises() {
  const c = content[state.level].chapters[state.chapterIndex];
  const total = c.exercises.length;
  const idx = state.currentExercise;

  if (idx >= total) {
    state.screen = "result";
    render();
    return;
  }

  const ex = c.exercises[idx];
  const progressPct = (idx / total) * 100;

  let html = `
    <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    <p class="subtitle">Задание ${idx + 1} из ${total}</p>
    <div class="exercise">
      <div class="exercise-label">${ex.label}</div>
      <div class="question">${ex.question}</div>
  `;

  if (ex.type === "fill") {
    html += `<input type="text" id="user-input" placeholder="Впиши слово..." autocomplete="off">`;
  } else if (ex.type === "choice") {
    html += `<div class="options">`;
    ex.options.forEach((opt, i) => {
      html += `<button class="option" id="opt-${i}" onclick="selectOption(${i})">${opt}</button>`;
    });
    html += `</div>`;
  } else if (ex.type === "tf") {
    html += `<div class="tf-row">
      <button class="option" id="opt-true" onclick="selectTF(true)">True</button>
      <button class="option" id="opt-false" onclick="selectTF(false)">False</button>
    </div>`;
  }

  html += `<div id="feedback"></div>`;
  html += `<button id="check-btn" onclick="checkAnswer()">Проверить</button>`;
  html += `</div>`;

  app.innerHTML = html;

  const inp = document.getElementById("user-input");
  if (inp) {
    inp.focus();
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter") checkAnswer();
    });
  }
}

let selectedValue = null;

function selectOption(i) {
  selectedValue = i;
  document.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
  document.getElementById(`opt-${i}`).classList.add("selected");
}

function selectTF(val) {
  selectedValue = val;
  document.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
  document.getElementById(`opt-${val ? "true" : "false"}`).classList.add("selected");
}

const normalize = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

function checkAnswer() {
  const c = content[state.level].chapters[state.chapterIndex];
  const ex = c.exercises[state.currentExercise];
  let userAnswer = null;
  let isCorrect = false;

  if (ex.type === "fill") {
    const inp = document.getElementById("user-input");
    userAnswer = inp.value.trim();
    if (!userAnswer) return;
    isCorrect = normalize(userAnswer) === normalize(ex.answer);
  } else if (ex.type === "choice") {
    if (selectedValue === null) return;
    userAnswer = selectedValue;
    isCorrect = selectedValue === ex.answer;
  } else if (ex.type === "tf") {
    if (selectedValue === null) return;
    userAnswer = selectedValue;
    isCorrect = selectedValue === ex.answer;
  }

  state.answers[state.currentExercise] = { correct: isCorrect, userAnswer };

  const fb = document.getElementById("feedback");
  const checkBtn = document.getElementById("check-btn");

  if (isCorrect) {
    fb.className = "feedback correct";
    let quoteHtml = "";
    if (ex.quote) {
      quoteHtml = `<div class="quote">📖 «${ex.quote}»</div>`;
    }
    fb.innerHTML = `✅ Верно!${quoteHtml}`;
  } else {
    fb.className = "feedback wrong";
    let correctText = "";
    if (ex.type === "fill") correctText = ex.answer;
    else if (ex.type === "choice") correctText = ex.options[ex.answer];
    else if (ex.type === "tf") correctText = ex.answer ? "True" : "False";

    let quoteHtml = "";
    if (ex.quote) {
      quoteHtml = `<div class="quote">📖 «${ex.quote}»</div>`;
    }

    fb.innerHTML = `❌ Неправильно. Правильный ответ: <b>${correctText}</b>${quoteHtml}`;
  }

  if (ex.type === "choice") {
    document.getElementById(`opt-${ex.answer}`).classList.add("correct");
    if (!isCorrect && userAnswer !== null) {
      document.getElementById(`opt-${userAnswer}`).classList.add("wrong");
    }
  } else if (ex.type === "tf") {
    document.getElementById(`opt-${ex.answer ? "true" : "false"}`).classList.add("correct");
    if (!isCorrect && userAnswer !== null) {
      document.getElementById(`opt-${userAnswer ? "true" : "false"}`).classList.add("wrong");
    }
  }

  checkBtn.textContent = "Далее →";
  checkBtn.onclick = nextExercise;

  const inp = document.getElementById("user-input");
  if (inp) inp.disabled = true;
  document.querySelectorAll(".option").forEach(el => el.onclick = null);
}

function nextExercise() {
  state.currentExercise++;
  selectedValue = null;
  render();
}

function renderResult() {
  const c = content[state.level].chapters[state.chapterIndex];
  const total = c.exercises.length;
  const correct = Object.values(state.answers).filter(a => a.correct).length;
  const percent = Math.round((correct / total) * 100);

  const lp = getLevelProgress();
  lp[c.id] = { done: true, correct, total, percent };
  saveProgress();

  const isLastChapter = state.chapterIndex >= content[state.level].chapters.length - 1;

  if (isLastChapter) {
    renderFinalScreen(correct, total, percent);
    return;
  }

  let emoji = "🎉";
  let msg = "Отлично!";
  if (percent < 50) { emoji = "💪"; msg = "Есть над чем поработать."; }
  else if (percent < 80) { emoji = "👍"; msg = "Хороший результат!"; }

  app.innerHTML = `
    <div class="result-box">
      <div class="big">${emoji}</div>
      <h1>${msg}</h1>
      <p>Глава ${c.id} завершена</p>
      <p style="font-size:24px; font-weight:bold; color:#93c5fd; margin-top:16px;">
        ${correct} / ${total} (${percent}%)
      </p>
    </div>
    <button onclick="backToMap()">← К выбору глав</button>
    <button class="secondary" onclick="openChapter(${state.chapterIndex + 1})">Следующая глава →</button>
  `;
}

function renderFinalScreen(correct, total, percent) {
  const lp = getLevelProgress();
  let totalCorrect = 0;
  let totalExercises = 0;
  for (let i = 1; i <= TOTAL_CHAPTERS; i++) {
    if (lp[i]) {
      totalCorrect += lp[i].correct;
      totalExercises += lp[i].total;
    }
  }
  const overallPercent = Math.round((totalCorrect / totalExercises) * 100);

  const otherLevelName = state.level === 'a2' ? 'B2' : 'A2';

  app.innerHTML = `
    <div class="final-screen">
      <span class="emoji">🎉</span>
      <h1>Поздравляем!</h1>
      <p class="story-title">Ты прочитал всю книгу «Lost in New York» на уровне ${state.level.toUpperCase()}</p>
      
      <div class="final-stats">
        <div class="stat-row">
          <span>Глав пройдено</span>
          <span class="stat-value">7 / 7</span>
        </div>
        <div class="stat-row">
          <span>Правильных ответов</span>
          <span class="stat-value">${totalCorrect} / ${totalExercises}</span>
        </div>
        <div class="stat-row">
          <span>Общий результат</span>
          <span class="stat-value">${overallPercent}%</span>
        </div>
      </div>

      <p class="final-thanks">
        Спасибо, что был с Аней и Джейком в их первой поездке в Нью-Йорк.<br>
        До новых встреч в городе, который никогда не спит. 🗽
      </p>

      <button onclick="backToStart()">Пройти уровень ${otherLevelName} →</button>
      <button class="secondary" onclick="backToMap()">← К выбору глав</button>
    </div>
  `;
}

render();
</script>
